# pi_wgpu · WebGPU 兼容子集的 GL 直替层——骨架声明工程（公开壳+实现芯桩；逻辑体由后续批次补全）
# 依赖版本策略：开发期 path 钉定；官方挂接批切 registry 发布版
[package]
name = "pi_wgpu"
version = "0.4.0"
edition = "2021"
description = "WebGPU compatible subset on GL/GLES/WebGL2 - rebuilt skeleton (design: pi-wgpu-rebuild)"
license = "MIT OR Apache-2.0"

[features]
default = ["gl"]
gl = []
single_thread = []
geterror = []
webgl_context = []
webgl = []

use_wgpu = ["dep:wgpu"]  # B13 薄壳 facade：整面 re-export 官方 wgpu；与 gl 互斥

[dependencies]
once_cell = "=1.21.3"  # 钉住本 naga fork 传递依赖的可用版本（新版本缺 sync 模块）
pi_egl = { path = "../pi_egl" }
pi_glow = { package = "pi_glow", path = "../pi_glow" }
pi_share = { path = "../pi_share" }
pi_hash = { path = "../pi_hash" }
naga = { version = "25.0", features = ["wgsl-in", "glsl-in", "glsl-out"] }
thiserror = "1.0"
log = "0.4"
raw-window-handle = "0.6"
wgpu = { path = "../wgpu/wgpu", optional = true }

[patch.crates-io]
naga = { path = "../wgpu/naga" }
pi_share = { path = "../pi_share" }

[patch."http://ser.yinengyun.com:10082/tech/crates-io.git"]
pi_glow = { path = "../pi_glow" }

[dev-dependencies]
winit = "0.30"
pollster = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "OffscreenCanvas", "ImageBitmap", "Window", "Navigator"] }
js-sys = "0.3"
