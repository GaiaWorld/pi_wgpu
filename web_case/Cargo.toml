# pi_wgpu Web(WebGL2) 案例：独立小包（不随主仓桌面构建）；wasm-pack build --target web 产 pkg/，index.html 自挂。
[package]
name = "pi_web_case"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# 自成一族工作区：与父仓同形 patch（本地 naga/wgpu-types/pi_share/pi_glow 钉源）。
[workspace]

[patch.crates-io]
naga = { path = "../../wgpu/naga" }
wgpu-types = { path = "../../wgpu/wgpu-types" }
pi_share = { path = "../../pi_share" }

[patch."http://ser.yinengyun.com:10082/tech/crates-io.git"]
pi_glow = { path = "../../pi_glow" }

[dependencies]
pi_wgpu = { path = "..", features = ["single_thread"] }  # 产品 Web 形态同形（单主线程退化）
wasm-bindgen = "0.2"
js-sys = "0.3"
log = { version = "0.4", features = ["std"] }
pollster = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "console"] }
